# Fly.io — app nomi GLOBAL bo‘lishi kerak (boshqa foydalanuvchi olgan bo‘lishi mumkin)
# Dashboard’da App name ni shu nomga mos qiling yoki quyidagini o‘zgartiring
app = "buildflow-aeuzcoder"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[env]
  ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "30"
