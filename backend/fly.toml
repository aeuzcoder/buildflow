# fly.toml app configuration file generated for buildflow on 2026-05-27T17:17:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'buildflow'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  ACCESS_TOKEN_EXPIRE_MINUTES = '30'
  ALGORITHM = 'HS256'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
